name: OmniDrive quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - fix/free-cloudflare-readiness

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Worker unit tests
        run: npm run test -w packages/worker
      - name: Worker runtime TypeScript check
        run: npm run typecheck -w packages/worker
      - name: Frontend build and TypeScript check
        run: npm run build -w packages/web
